workflows:
  android-apk:
    name: Bricola APK
    max_build_duration: 60
    # mac_mini_m2 uses the 500 free monthly minutes of the individual plan.
    # (Linux/Windows builds are NOT covered by free minutes.)
    instance_type: mac_mini_m2
    environment:
      flutter: stable
    scripts:
      - name: Flutter packages
        script: flutter pub get
      - name: Build release APK (demo mode until Firebase is configured)
        script: flutter build apk --release
    artifacts:
      - build/app/outputs/flutter-apk/app-release.apk
